<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ET710 Assignment 5 - Version 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="scene">
        <div class="moon" aria-hidden="true"></div>
        <div class="stars" aria-hidden="true"></div>

        <section class="clock-card" aria-label="Decorative clock showing ten ten">
            <div class="clock">
                <img class="hand hour-hand" src="hand.png" alt="Hour hand">
                <img class="hand minute-hand" src="hand.png" alt="Minute hand">
                <div class="pin" aria-hidden="true"></div>
            </div>
            <p class="clock-label">CITY TIME</p>
        </section>

        <div class="skyline" aria-hidden="true">
            <div class="building b1"></div>
            <div class="building b2"></div>
            <div class="building b3"></div>
            <div class="building b4"></div>
            <div class="building b5"></div>
            <div class="building b6"></div>
            <div class="building b7"></div>
            <div class="building b8"></div>
        </div>

        <div class="reflection" aria-hidden="true"></div>
        <p class="student-name">Umut Gander</p>
    </main>
</body>
</html>
